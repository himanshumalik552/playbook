name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  PUPPETEER_SKIP_DOWNLOAD: true
  NODE_ENV: test
  DATABASE_URL: postgresql://adpulse:adpulse_ci@localhost:5432/adpulse?schema=public
  REDIS_URL: redis://localhost:6379
  # CI-only throwaway values; production secrets live in the deployment environment.
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnopqrstuvwx
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijklmnopqrstuv
  ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktZm9yLXRlc3RzLTMyYiE=
  INTEGRATION_MODE: mock

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma format and validate
        run: pnpm --filter @adpulse/database exec prisma validate && pnpm --filter @adpulse/database exec prisma format --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit:deps

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adpulse
          POSTGRES_PASSWORD: adpulse_ci
          POSTGRES_DB: adpulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adpulse" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: development
      WEB_URL: http://localhost:5173
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adpulse/database exec prisma migrate deploy
      - run: pnpm turbo run build --filter=@adpulse/api... --filter=@adpulse/worker...
      - run: pnpm test:integration
      - run: pnpm --filter @adpulse/worker seed
      - run: pnpm --filter @adpulse/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: adpulse/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
