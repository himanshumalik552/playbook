# Local development.
#   docker compose up -d postgres redis   -> data stores only; run the apps with `pnpm dev`
#   docker compose --profile app up --build -> full stack in containers on http://localhost:8080
name: adpulse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adpulse_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-adpulse}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: adpulse-api:local
    command: ['node', 'node_modules/@adpulse/database/dist/migrate.js']
    env_file: .env
    environment: &container-env
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-adpulse}:${POSTGRES_PASSWORD:-adpulse_dev_only}@postgres:5432/${POSTGRES_DB:-adpulse}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:8080
      API_URL: http://localhost:8080
      LOCAL_STORAGE_PATH: /app/storage
      TRUST_PROXY: 'true'
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [app]
    image: adpulse-api:local
    env_file: .env
    environment: *container-env
    volumes:
      - report-storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    image: adpulse-worker:local
    env_file: .env
    environment: *container-env
    volumes:
      - report-storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: adpulse-web:local
    ports:
      - '8080:8080'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  report-storage:
